apply plugin: 'com.android.application'

android {
    namespace = "com.travel.offices"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.travel.offices"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 34
        versionName "1.0.0.34"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.gms:play-services-ads:24.9.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Memory leak detection — debug builds only (zero impact on release APK)
}

apply from: 'capacitor.build.gradle'

// ── Auto-build web assets before every Android build ──────────────────────
task buildWebAssets(type: Exec) {
    description 'Run npm build then copy web assets into Android assets folder'
    workingDir file('../../')

    def isWindows = System.properties['os.name'].toLowerCase().contains('windows')

    if (isWindows) {
        // Android Studio JVM doesn't inherit the user PATH, so we add Node.js
        // locations manually so npm/npx are found regardless of IDE settings.
        def appData   = System.getenv('APPDATA') ?: ''
        def extraPath = "${appData}\\npm;C:\\Program Files\\nodejs;C:\\Program Files (x86)\\nodejs"
        environment 'PATH', "${extraPath};${System.getenv('PATH') ?: ''}"
        commandLine 'cmd', '/c', 'npm run build && npx cap copy android'
    } else {
        def home      = System.getenv('HOME') ?: ''
        def extraPath = "/usr/local/bin:/usr/bin:${home}/.nvm/current/bin:${home}/.volta/bin"
        environment 'PATH', "${extraPath}:${System.getenv('PATH') ?: ''}"
        commandLine 'sh', '-c', 'npm run build && npx cap copy android'
    }

    // Gradle up-to-date check — skips rebuild if src hasn't changed
    inputs.files(fileTree('../../src'), file('../../package.json'), file('../../capacitor.config.ts'))
    outputs.dir('src/main/assets/public')
}
preBuild.dependsOn buildWebAssets
// ──────────────────────────────────────────────────────────────────────────

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
